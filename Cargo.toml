[package]
name = "req-guard"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["full"] }
bytes = "1.4.0"
clap = { version = "4.6.4", features = ["derive"] }
